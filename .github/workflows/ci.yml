name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: every indicator against its fixture (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

  oracle:
    name: every fixture regenerates from the pinned libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - run: 'python -m pip install --only-binary=:all: -r oracle/requirements.txt'
      - run: python -I oracle/generate.py --check --all
